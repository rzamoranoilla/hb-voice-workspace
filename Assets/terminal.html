<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="xterm.css" />
  <style>
    html, body { margin: 0; height: 100%; background: #0c0c0c; overflow: hidden; }
    #terminal { position: absolute; inset: 4px 0 0 6px; }
    .xterm-viewport::-webkit-scrollbar { width: 10px; }
    .xterm-viewport::-webkit-scrollbar-track { background: #0c0c0c; }
    .xterm-viewport::-webkit-scrollbar-thumb { background: #444; border-radius: 5px; }
  </style>
</head>
<body>
  <div id="terminal"></div>
  <script src="xterm.js"></script>
  <script src="addon-fit.js"></script>
  <script>
    const host = window.chrome.webview;
    const container = document.getElementById('terminal');
    const term = new Terminal({
      fontFamily: 'Cascadia Mono, Consolas, monospace',
      fontSize: 13,
      cursorBlink: true,
      scrollback: 5000,
      // A wheel notch moves about three lines (the browser's own step is roughly twice that),
      // and the movement is animated.
      scrollSensitivity: 0.5,
      smoothScrollDuration: 120,
      theme: { background: '#0c0c0c', foreground: '#cccccc' }
    });
    const fit = new FitAddon.FitAddon();
    term.loadAddon(fit);
    term.open(container);

    const send = (type, extra) => host.postMessage(Object.assign({ type }, extra));

    term.onData(data => send('input', { data }));
    term.onResize(size => send('resize', { cols: size.cols, rows: size.rows }));

    // Ctrl+C copies when there is a selection, Ctrl+V pastes (the host reads the clipboard).
    term.attachCustomKeyEventHandler(e => {
      if (e.type !== 'keydown' || !e.ctrlKey || e.altKey) return true;
      const key = e.key.toLowerCase();
      if (key === 'c' && term.hasSelection()) {
        send('copy', { text: term.getSelection() });
        term.clearSelection();
        e.preventDefault();
        return false;
      }
      if (key === 'v') {
        send('paste');
        e.preventDefault();
        return false;
      }
      return true;
    });

    // Text selected with the mouse is copied as soon as the button is released.
    container.addEventListener('mouseup', e => {
      if (e.button === 0 && term.hasSelection()) send('copy', { text: term.getSelection() });
    });

    // Right click: copy the selection if there is one, otherwise paste (like the classic console).
    container.addEventListener('contextmenu', e => {
      e.preventDefault();
      if (term.hasSelection()) {
        send('copy', { text: term.getSelection() });
        term.clearSelection();
      } else {
        send('paste');
      }
    });

    // ---- Keeping the grid the size of the control ----
    // The control can be created hidden, be shown later, change size with the window and the
    // splitters, or move to a screen with another scale. Each of those re-fits the grid; the
    // fit is repeated shortly after because the browser measures the new size asynchronously.
    const sizeOf = () => ({ cols: term.cols, rows: term.rows });
    const refit = () => {
      if (container.offsetWidth <= 0 || container.offsetHeight <= 0) return;
      const dims = fit.proposeDimensions();
      if (!dims || !isFinite(dims.cols) || !isFinite(dims.rows) || dims.cols < 2 || dims.rows < 1) return;
      if (dims.cols !== term.cols || dims.rows !== term.rows) term.resize(dims.cols, dims.rows);
    };
    let refitTimer = 0;
    const refitSoon = () => {
      refit();
      requestAnimationFrame(refit);
      clearTimeout(refitTimer);
      refitTimer = setTimeout(refit, 250);
    };
    // The host asks for this when it resizes or shows the control: the shell is also told the
    // size again, in case a resize was missed while the control was hidden.
    const resync = () => {
      refitSoon();
      setTimeout(() => { refit(); send('resize', sizeOf()); }, 300);
    };

    new ResizeObserver(refitSoon).observe(container);
    window.addEventListener('resize', refitSoon);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) resync(); });
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(refitSoon);
    // A change of device pixel ratio means the window moved to a screen with another scale.
    const watchScale = () => {
      matchMedia(`(resolution: ${window.devicePixelRatio}dppx)`)
        .addEventListener('change', () => { resync(); watchScale(); }, { once: true });
    };
    watchScale();

    host.addEventListener('message', e => {
      if (e.data === '\u0000focus') term.focus();
      else if (e.data === '\u0000refit') resync();
      else term.write(e.data);
    });

    refit();
    send('ready', sizeOf());
    term.focus();
  </script>
</body>
</html>
